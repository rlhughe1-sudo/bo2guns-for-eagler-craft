
name: Build BO2Weapons

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build BO2Weapons
        run: mvn -B clean package

      - name: Upload BO2Weapons JAR
        uses: actions/upload-artifact@v4
        with:
          name: BO2Weapons
          path: target/BO2Weapons.jar
